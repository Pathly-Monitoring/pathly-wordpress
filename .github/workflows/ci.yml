# Lint, unit tests (100 % lines and branches), integration on a real WordPress
# (wp-env) with Plugin Check, and the zip to publish.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: WordPress Coding Standards and PHP 7.4 compatibility
        run: vendor/bin/phpcs
      - name: Versions aligned (plugin header, constant, readme, block)
        run: node bin/sync-version.js --check
      - name: French translation complete
        run: node bin/make-po.js fr_FR && git diff --exit-code -- languages/pathly-fr_FR.po

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.3' && 'xdebug' || 'none' }}
      - run: composer install --no-interaction --no-progress
      - name: PHPUnit
        if: matrix.php != '8.3'
        run: vendor/bin/phpunit
      - name: PHPUnit with coverage (100 % lines and branches, blocking)
        if: matrix.php == '8.3'
        run: |
          php -d memory_limit=-1 vendor/bin/phpunit --path-coverage --coverage-text=build/coverage.txt
          php bin/check-coverage.php build/coverage.txt

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: latest
            php: "8.3"
          - wordpress: latest
            php: "8.1"
          - wordpress: previous
            php: "7.4"
          - wordpress: latest
            php: "8.3"
            build: --wporg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: WordPress version
        run: |
          if [ "${{ matrix.wordpress }}" = "previous" ]; then
            version="$(curl -fsS https://api.wordpress.org/core/version-check/1.7/ | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const all = [...new Set(JSON.parse(s).offers.map(o => o.current))];
                const branch = v => v.split(".").slice(0, 2).join(".");
                const latest = branch(all[0]);
                console.log(all.find(v => branch(v) !== latest));
              });')"
            echo "WP_ENV_CORE=WordPress/WordPress#${version}" >> "$GITHUB_ENV"
          fi
          echo "WP_ENV_PHP_VERSION=${{ matrix.php }}" >> "$GITHUB_ENV"
      - name: Install, configure, update hook, badge, Plugin Check, uninstall
        env:
          PATHLY_BUILD_FLAG: ${{ matrix.build }}
        run: bash tests/integration/run.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pathly-plugin
          path: dist/pathly.zip
          retention-days: 14
