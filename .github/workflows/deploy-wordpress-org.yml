# Publishes a GitHub release to the WordPress.org plugin directory (SVN).
# Inactive until the plugin is approved: set the repository variable
# WPORG_DEPLOY=true and the secrets SVN_USERNAME / SVN_PASSWORD.
name: Publication WordPress.org

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/build.sh
      - uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: pathly
          BUILD_DIR: dist/pathly
          ASSETS_DIR: .wordpress-org
